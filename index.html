<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* CSS STYLES */
        body {
            background-color: #111;
            font-family: sans-serif;
            margin: 0;
            padding: 20px 0; /* Add space top and bottom */
        }

        /* The Container that holds all cards */
        .shop-container {
            display: flex;
            flex-direction: column; /* Stack them vertically */
            align-items: center;    /* Center them */
            gap: 30px;              /* Space between cards */
        }

        /* The Card Style */
        .card {
            background-color: white;
            width: 300px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .product-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .details { padding: 20px; text-align: center; }
        h2 { margin: 0; font-size: 22px; color: #333; }
        .price { font-size: 24px; font-weight: bold; color: #22c55e; margin: 10px 0; display: block; }
        
        button {
            background-color: black;
            color: white;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
        }
    </style>
</head>
